<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário</h1>

    <form>
        <fieldset>
         <legend>Dados Pessoais</legend>

         <label for="iptNome">Nome:</label> <input type="text" id="iptNome"> <br>
         <label for="iptDataNascimento">Data de nascimento:</label> <input type="date" id="iptDataNascimento"> <br>
         <label for="iptEndereço">Endereço:</label> <input type="text" id="iptEndereço"> <br>

         <label for="iptBairro">Bairro:</label> <input type="text" id="iptBairro">
          <label for="iptCidade">Cidade</label> <input type="text" id="iptCidade"> <br>

         <label for="iptCEP">CEP</label> <input type="number" id="iptCEP"> 
         <label id="iptEstado" for="Estado">Estado:</label>
         <select id="Estado" name="Estado">
            <option value="ce">Ceará</option>
            <option value="sp">São Paulo</option>
            <option value="al">Alagoas</option>
            <option value="go">Goiás</option>
            <option value="se">Sergipe</option>        
         </select> <br>

    </fieldset>
<br>

         <fieldset>
            <legend>Dados Profissionais</legend>
            <p>Natureza do Cargo </p> <br>

             <input type="radio" id="gerencia" name="cargo" value="Gerência">
             <label for="gerencia">Gerência</label>
             <input type="radio" id="financeiro" name="cargo" value="Financeiro">
             <label for="financeiro">Financeiro</label>
             <input type="radio" id="recepção" name="cargo" value="Recepção">
             <label for="recepção">Recepção</label>
             <input type="radio" id="administrativo" name="cargo" value="Administrativo">
             <label for="administrativo">Administrativo</label>
             <input type="radio" id="juridico" name="cargo" value="Jurídico">
             <label for="juridico">Jurídico</label> <br>

            <br>
            <p>Area de interesse</p>

            <input type="checkbox" id="computação" name="area" value="Computação">
            <label for="computação">Computação</label>
            <input type="checkbox" id="quimica" name="area" value="quimica">
            <label for="quimica">Química</label>
            <input type="checkbox" id="meioAmbiente" name="area" value="meioAmbiente">
            <label for="meioAmbiente">Meio Ambiente</label>
            <input type="checkbox" id="engenharia" name="area" value="engenharia">
            <label for="engenharia">Engenharia</label>
            <input type="checkbox" id="matematica" name="area" value="matematica">
            <label for="matematica">Matemática</label>
            <br>
            <p>Mini-currículo</p>
            <textarea name="message" rows="10" cols="30">Digite seu currículo aqui</textarea>
         </fieldset>
    </form>


    <button type="button">Entrar</button> <button type="reset">Limpar</button>


    
</body>
</html>
